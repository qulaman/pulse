<style>
/* ── Токены ───────────────────────────────────────────────────────────── */
:root{
  --bg:#0B0F14;
  --card:#131A22;
  --card-sunk:#0E141B;
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.12);

  --fg:#E8EEF4;
  --fg-2:#94A6B8;
  --fg-3:#63748A;

  /* Акцент — ЗАМЕНИТЬ на фирменный цвет WAG, когда он будет определён.
     Используется только для прогресса, активных состояний и линий-указателей. */
  --accent:#4FA8FF;
  --accent-dim:rgba(79,168,255,.16);

  /* Статусные цвета — ТОЛЬКО для состояний, больше нигде. */
  --ok:#3ECF8E;
  --warn:#E9B949;
  --bad:#E5544B;

  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Consolas,"Liberation Mono",monospace;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue","Noto Sans",Roboto,sans-serif;

  --r:14px;
  --pad:clamp(16px,4vw,36px);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font:16px/1.5 var(--sans);
  letter-spacing:.005em;
  -webkit-font-smoothing:antialiased;
  padding-bottom:56px;
}
/* Едва заметное свечение сверху — глубина без шума */
body::before{
  content:"";position:fixed;inset:0 0 auto 0;height:420px;pointer-events:none;z-index:0;
  background:radial-gradient(120% 100% at 50% -30%,rgba(79,168,255,.10),transparent 62%);
}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 var(--pad)}

/* ── Типографика служебная ────────────────────────────────────────────── */
.eyebrow{
  font:600 11px/1 var(--mono);
  letter-spacing:.18em;text-transform:uppercase;color:var(--fg-3);
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ── Шапка ────────────────────────────────────────────────────────────── */
header.top{padding:clamp(28px,6vw,64px) 0 0}
.masthead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  padding-bottom:14px;border-bottom:1px solid var(--line-2)}
h1{margin:0;font-size:clamp(26px,5.2vw,40px);font-weight:650;letter-spacing:-.02em;line-height:1.05}
h1 small{display:block;margin-top:8px;font:400 13px/1.4 var(--sans);color:var(--fg-3);letter-spacing:0}

.stats{
  display:grid;grid-template-columns:repeat(3,1fr);
  border-bottom:1px solid var(--line-2);
}
.stat{padding:22px 0 20px}
.stat + .stat{border-left:1px solid var(--line);padding-left:clamp(14px,3vw,28px)}
.stat .k{font-size:clamp(32px,7vw,54px);font-weight:600;line-height:1;color:var(--fg);display:block}
.stat .k .sub{font-size:.42em;color:var(--fg-3);font-weight:500;letter-spacing:0}
.stat .cap{display:block;margin-bottom:10px}
.stat .foot{margin-top:8px;font-size:12.5px;color:var(--fg-3)}
.stat.muted .k{color:var(--fg-3);font-size:clamp(17px,3.4vw,22px);letter-spacing:0}

/* Прогресс-бар */
.progress{margin:20px 0 0}
.bar{height:8px;border-radius:99px;background:var(--card-sunk);overflow:hidden;display:flex;
  box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.bar .done{background:var(--accent)}
.bar .prog{background:var(--accent);opacity:.34}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:7px;font:500 12.5px/1 var(--sans);color:var(--fg-2)}
.legend b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--fg)}
.dot{width:8px;height:8px;border-radius:99px;background:var(--fg-3);flex:none}
.dot.done{background:var(--ok)} .dot.in_progress{background:var(--warn)}
.dot.dropped{background:var(--bad)} .dot.plan{background:#33404E}

/* ── Секции ───────────────────────────────────────────────────────────── */
section{margin-top:clamp(40px,7vw,72px)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding-bottom:12px;border-bottom:1px solid var(--line-2);margin-bottom:22px}
.sec-head h2{margin:0;font-size:clamp(17px,3vw,21px);font-weight:600;letter-spacing:-.01em}
.sec-head .eyebrow{white-space:nowrap}

.phase{display:flex;align-items:center;gap:14px;margin:34px 0 16px}
.phase:first-of-type{margin-top:0}
.phase .eyebrow{color:var(--fg-2)}
.phase i{flex:1;height:1px;background:var(--line)}

/* ── Карточка недели ──────────────────────────────────────────────────── */
.weeks{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(370px,1fr))}
.week{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;
}
.week::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent}
.week[data-status="in_progress"]::before{background:var(--warn)}
.week[data-status="done"]::before{background:var(--ok)}
.week[data-status="dropped"]::before{background:var(--bad)}
.week.current{border-color:rgba(79,168,255,.45);box-shadow:0 0 0 1px rgba(79,168,255,.18),0 12px 40px -18px rgba(79,168,255,.5)}

.w-head{display:flex;gap:14px;align-items:flex-start}
.w-num{font:600 30px/0.9 var(--mono);letter-spacing:-.04em;color:var(--fg-3);flex:none;padding-top:2px;min-width:44px}
.week[data-status="done"] .w-num{color:var(--ok)}
.week[data-status="in_progress"] .w-num{color:var(--warn)}
.w-title{margin:0;font-size:16.5px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.w-meta{margin-top:5px;font:500 12px/1 var(--mono);color:var(--fg-3);letter-spacing:.02em}
.badge{margin-left:auto;flex:none;font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  padding:6px 8px;border-radius:6px;border:1px solid var(--line-2);color:var(--fg-3);white-space:nowrap}
.badge[data-s="in_progress"]{color:var(--warn);border-color:rgba(233,185,73,.35);background:rgba(233,185,73,.08)}
.badge[data-s="done"]{color:var(--ok);border-color:rgba(62,207,142,.35);background:rgba(62,207,142,.08)}
.badge[data-s="dropped"]{color:var(--bad);border-color:rgba(229,84,75,.35);background:rgba(229,84,75,.08)}

.w-note{font-size:12.5px;color:var(--fg-3);border-left:2px solid var(--line-2);padding-left:10px}

ul.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
ul.tasks li{display:flex;gap:11px;align-items:flex-start;font-size:14.5px;line-height:1.45;color:var(--fg-2)}
ul.tasks li .txt{flex:1}
li[data-s="done"] .txt{color:var(--fg-3)}
li[data-s="in_progress"] .txt{color:var(--fg)}
li[data-s="dropped"] .txt{color:var(--fg-3);text-decoration:line-through;text-decoration-color:rgba(229,84,75,.6)}

.box{flex:none;width:15px;height:15px;margin-top:2px;border-radius:4px;border:1.5px solid #35424F;position:relative}
li[data-s="in_progress"] .box{border-color:var(--warn)}
li[data-s="in_progress"] .box::after{content:"";position:absolute;inset:2.5px;border-radius:1.5px;background:var(--warn)}
li[data-s="done"] .box{border-color:var(--ok);background:var(--ok)}
li[data-s="done"] .box::after{content:"";position:absolute;left:4.2px;top:1.2px;width:4px;height:7.5px;
  border:solid var(--card);border-width:0 2px 2px 0;transform:rotate(42deg)}
li[data-s="dropped"] .box{border-color:var(--bad)}
li[data-s="dropped"] .box::after{content:"";position:absolute;left:2px;right:2px;top:5.2px;height:1.5px;background:var(--bad)}

.tag{display:inline-block;font:600 9.5px/1 var(--mono);letter-spacing:.12em;color:var(--fg-3);
  border:1px solid var(--line-2);border-radius:4px;padding:3px 5px;margin-right:7px;vertical-align:1.5px}
.tag.gate{color:var(--accent);border-color:rgba(79,168,255,.4)}

.crit,.fact{background:var(--card-sunk);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.crit{border-left:2px solid var(--accent)}
.crit p,.fact p{margin:6px 0 0;font-size:13.5px;line-height:1.45;color:var(--fg-2)}
.fact p.empty{color:var(--fg-3);font-family:var(--mono)}
.fact .when{float:right;font:500 11px/1 var(--mono);color:var(--fg-3)}
.w-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}

/* ── Метрики ──────────────────────────────────────────────────────────── */
.metrics{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.metric{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px}
.metric .cap{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px}
.metric .name{font-size:14px;font-weight:600;line-height:1.3}
.metric .w{font:600 10px/1 var(--mono);letter-spacing:.1em;color:var(--fg-3);white-space:nowrap}
.metric .row{display:flex;align-items:flex-end;gap:16px}
.metric .val{font:600 34px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.metric .val.empty{color:#2E3A47}
.metric .goal{font:500 13px/1.2 var(--mono);color:var(--fg-2);padding-bottom:4px}
.metric .goal em{font-style:normal;color:var(--fg-3);display:block;font-family:var(--sans);font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;margin-bottom:4px}
.metric .hint{margin:12px 0 0;padding-top:11px;border-top:1px solid var(--line);
  font-size:12.5px;line-height:1.4;color:var(--fg-3)}

/* ── Демо / Б-трек ────────────────────────────────────────────────────── */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:600 10.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--fg-3);
  padding:14px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px 16px;border-bottom:1px solid var(--line);color:var(--fg-2);vertical-align:top;line-height:1.45}
tr:last-child td{border-bottom:0}
td.d{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--fg);white-space:nowrap}
.empty-state{padding:26px 16px;text-align:center;color:var(--fg-3);font-size:13.5px;line-height:1.5}
.empty-state b{display:block;color:var(--fg-2);font-weight:600;margin-bottom:5px}

.bt{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-bottom:1px solid var(--line)}
.bt:last-child{border-bottom:0}
.bt .box{margin-top:3px}
.bt .t{flex:1;font-size:14.5px;line-height:1.4}
.bt .t em{display:block;font-style:normal;font-size:12.5px;color:var(--fg-3);margin-top:3px}
.bt .wk{flex:none;font:600 10.5px/1 var(--mono);letter-spacing:.1em;color:var(--fg-3);padding-top:4px}
.bt[data-s="done"] .t{color:var(--fg-3)}
.bt[data-s="dropped"] .t{color:var(--fg-3);text-decoration:line-through}

footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;color:var(--fg-3);font-size:12px}
footer code{font-family:var(--mono);color:var(--fg-2)}

.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── Мобильный ────────────────────────────────────────────────────────── */
@media (max-width:720px){
  .stats{grid-template-columns:1fr 1fr}
  .stat:nth-child(3){grid-column:1/-1;border-left:0;padding-left:0;border-top:1px solid var(--line)}
  .weeks{grid-template-columns:1fr}
  .metrics{grid-template-columns:1fr 1fr}
  .w-num{font-size:26px;min-width:38px}
  th,td{padding:12px 13px}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .table-scroll table{min-width:560px}
}
@media (max-width:430px){
  .metrics{grid-template-columns:1fr}
  .masthead{flex-direction:column;align-items:flex-start;gap:10px}
}

/* ── Появление ────────────────────────────────────────────────────────── */
@media (prefers-reduced-motion:no-preference){
  .reveal{opacity:0;transform:translateY(8px);animation:in .5s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes in{to{opacity:1;transform:none}}
}
@media print{body::before{display:none}.week,.metric,.panel{break-inside:avoid}}
</style>
</head>

<body>
<div class="wrap">

  <header class="top">
    <div class="masthead">
      <h1 id="title">WAG Pulse<small id="subtitle"></small></h1>
      <div class="eyebrow">трекер · план / факт</div>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="eyebrow cap">текущая неделя</span>
        <span class="k num" id="curWeek">—</span>
        <span class="foot" id="curWeekFoot"></span>
      </div>
      <div class="stat">
        <span class="eyebrow cap">задачи закрыты</span>
        <span class="k num" id="doneCount">0<span class="sub" id="totalCount"></span></span>
        <span class="foot" id="doneFoot"></span>
      </div>
      <div class="stat">
        <span class="eyebrow cap">недели закрыты</span>
        <span class="k num" id="weekDone">0<span class="sub" id="weekTotal"></span></span>
        <span class="foot" id="weekFoot"></span>
      </div>
    </div>

    <div class="progress">
      <div class="bar" id="bar" role="progressbar" aria-label="Прогресс по задачам" aria-valuemin="0" aria-valuemax="100">
        <i class="done" id="barDone" style="width:0"></i><i class="prog" id="barProg" style="width:0"></i>
      </div>
      <div class="legend" id="legend"></div>
    </div>
  </header>

  <section id="weeksSection">
    <div class="sec-head">
      <h2>12 недель</h2>
      <span class="eyebrow">план из PLAN_12_WEEKS.md</span>
    </div>
    <div id="weeks"></div>
  </section>

  <section>
    <div class="sec-head">
      <h2>Метрики пилота</h2>
      <span class="eyebrow">цель / факт</span>
    </div>
    <div class="metrics" id="metrics"></div>
  </section>

  <section>
    <div class="sec-head">
      <h2>Журнал пятничных демо</h2>
      <span class="eyebrow">пятница 16:00 · 30 мин</span>
    </div>
    <div class="panel" id="demos"></div>
  </section>

  <section>
    <div class="sec-head">
      <h2>Б-трек</h2>
      <span class="eyebrow">ТОО · Astana Hub · транши · мерч</span>
    </div>
    <div class="panel" id="btrack"></div>
  </section>

  <footer>
    <span>Обновление факта — правка объекта <code>DATA</code> в начале этого файла.</span>
    <span id="genLine"></span>
  </footer>
</div>

<script>
(function () {
  "use strict";

  var LABEL = { plan:"план", in_progress:"в работе", done:"готово", dropped:"снято" };
  var ORDER = ["plan","in_progress","done","dropped"];
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function fmtDate(iso) {
    if (!iso) return "";
    var p = String(iso).split("-");
    if (p.length !== 3) return String(iso);
    return p[2] + "." + p[1] + "." + p[0];
  }
  function normStatus(s) { return ORDER.indexOf(s) === -1 ? "plan" : s; }

  /* Статус недели выводится из статусов её задач. */
  function weekStatus(w) {
    var t = w.tasks.map(function (x) { return normStatus(x.status); });
    var live = t.filter(function (s) { return s !== "dropped"; });
    if (!t.length) return "plan";
    if (!live.length) return "dropped";
    if (live.every(function (s) { return s === "done"; })) return "done";
    if (live.some(function (s) { return s === "in_progress" || s === "done"; })) return "in_progress";
    return "plan";
  }

  /* Текущая неделя от startDate (ISO-понедельник недели 1). */
  function currentWeek() {
    if (!DATA.startDate) return null;
    var p = String(DATA.startDate).split("-");
    var start = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
    var now = new Date();
    var today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.floor((today - start.getTime()) / 604800000) + 1;
  }

  /* ── Шапка ── */
  function renderHead() {
    document.title = DATA.project + " — Трекер";
    $("title").firstChild.nodeValue = DATA.project;
    $("subtitle").textContent = DATA.subtitle || "";

    var counts = { plan:0, in_progress:0, done:0, dropped:0 };
    DATA.weeks.forEach(function (w) {
      w.tasks.forEach(function (t) { counts[normStatus(t.status)]++; });
    });
    var total = counts.plan + counts.in_progress + counts.done + counts.dropped;
    var active = total - counts.dropped;
    var pctDone = active ? counts.done / active * 100 : 0;
    var pctProg = active ? counts.in_progress / active * 100 : 0;

    $("doneCount").firstChild.nodeValue = String(counts.done);
    $("totalCount").textContent = "/" + active;
    $("doneFoot").textContent = counts.dropped
      ? "из " + total + " задач плана, снято " + counts.dropped
      : "задач во всех 12 неделях";

    var wk = currentWeek();
    var el = $("curWeek"), foot = $("curWeekFoot"), stat = el.parentNode;
    if (wk === null) {
      stat.classList.add("muted");
      el.textContent = "старт не назначен";
      foot.innerHTML = "задать <code>DATA.startDate</code> — понедельник недели 1";
    } else if (wk < 1) {
      stat.classList.add("muted");
      el.textContent = "старт " + fmtDate(DATA.startDate);
      foot.textContent = "до старта " + (1 - wk) + " нед.";
    } else if (wk > DATA.horizonWeeks) {
      stat.classList.add("muted");
      el.textContent = "программа завершена";
      foot.textContent = "прошло " + wk + " недель от " + fmtDate(DATA.startDate);
    } else {
      el.innerHTML = esc(wk) + '<span class="sub">/' + DATA.horizonWeeks + "</span>";
      foot.textContent = "старт " + fmtDate(DATA.startDate);
    }

    var wDone = DATA.weeks.filter(function (w) { return weekStatus(w) === "done"; }).length;
    var wProg = DATA.weeks.filter(function (w) { return weekStatus(w) === "in_progress"; }).length;
    $("weekDone").firstChild.nodeValue = String(wDone);
    $("weekTotal").textContent = "/" + DATA.weeks.length;
    $("weekFoot").textContent = wProg ? "в работе: " + wProg : "критерий недели выполнен полностью";

    $("barDone").style.width = pctDone + "%";
    $("barProg").style.width = pctProg + "%";
    $("bar").setAttribute("aria-valuenow", Math.round(pctDone));
    $("bar").setAttribute("aria-valuetext", counts.done + " из " + active + " задач");

    $("legend").innerHTML = ORDER.map(function (s) {
      return '<span><i class="dot ' + s + '"></i>' + LABEL[s] + " <b>" + counts[s] + "</b></span>";
    }).join("");
  }

  /* ── Недели ── */
  function taskHtml(t) {
    var s = normStatus(t.status);
    var tag = "";
    if (t.gate) tag += '<span class="tag gate">ГЕЙТ</span>';
    if (t.track) tag += '<span class="tag">' + esc(t.track) + "</span>";
    return '<li data-s="' + s + '"><span class="box" aria-hidden="true"></span>' +
      '<span class="txt">' + tag + esc(t.text) +
      '<span class="vh"> — ' + LABEL[s] + "</span></span></li>";
  }

  function weekHtml(w, cur, i) {
    var s = weekStatus(w);
    var live = w.tasks.filter(function (t) { return normStatus(t.status) !== "dropped"; });
    var done = live.filter(function (t) { return normStatus(t.status) === "done"; }).length;
    var isCur = cur === w.n;

    return '<article class="week reveal' + (isCur ? " current" : "") + '" data-status="' + s +
        '" style="animation-delay:' + Math.min(i * 35, 400) + 'ms">' +
      '<div class="w-head">' +
        '<span class="w-num" aria-hidden="true">' + (w.n < 10 ? "0" : "") + w.n + "</span>" +
        "<div>" +
          '<h3 class="w-title">' + esc(w.title) + "</h3>" +
          '<div class="w-meta">неделя ' + w.n + " · " + done + " / " + live.length +
            (isCur ? " · сейчас" : "") + "</div>" +
        "</div>" +
        '<span class="badge" data-s="' + s + '">' + LABEL[s] + "</span>" +
      "</div>" +
      (w.note ? '<div class="w-note">' + esc(w.note) + "</div>" : "") +
      '<ul class="tasks">' + w.tasks.map(taskHtml).join("") + "</ul>" +
      '<div class="w-foot">' +
        '<div class="crit"><span class="eyebrow">✅ ' + esc(w.criterionLabel || "критерий недели") + "</span>" +
          "<p>" + esc(w.criterion) + "</p></div>" +
        '<div class="fact"><span class="eyebrow">факт</span>' +
          (w.closedAt ? '<span class="when">закрыта ' + fmtDate(w.closedAt) + "</span>" : "") +
          (w.factNote ? "<p>" + esc(w.factNote) + "</p>" : '<p class="empty">—</p>') +
        "</div>" +
      "</div>" +
    "</article>";
  }

  function renderWeeks() {
    var cur = currentWeek(), i = 0;
    var phases = DATA.phases && DATA.phases.length
      ? DATA.phases
      : [{ title: "", range: [1, DATA.horizonWeeks] }];

    $("weeks").innerHTML = phases.map(function (ph) {
      var list = DATA.weeks.filter(function (w) { return w.n >= ph.range[0] && w.n <= ph.range[1]; });
      if (!list.length) return "";
      var cards = list.map(function (w) { return weekHtml(w, cur, i++); }).join("");
      return '<div class="phase"><span class="eyebrow">недели ' + ph.range[0] + "–" + ph.range[1] +
        (ph.title ? " · " + esc(ph.title) : "") + "</span><i></i></div>" +
        '<div class="weeks">' + cards + "</div>";
    }).join("");
  }

  /* ── Метрики ── */
  function renderMetrics() {
    $("metrics").innerHTML = DATA.metrics.map(function (m, i) {
      var has = m.fact !== null && m.fact !== undefined && m.fact !== "";
      var val = has ? esc(m.fact) + (typeof m.fact === "number" && m.unit ? " " + esc(m.unit) : "") : "—";
      return '<div class="metric reveal" style="animation-delay:' + Math.min(i * 35, 300) + 'ms">' +
        '<div class="cap"><span class="name">' + esc(m.label) + "</span>" +
          '<span class="w">Н' + esc(m.week) + "</span></div>" +
        '<div class="row"><span class="val' + (has ? "" : " empty") + '">' + val + "</span>" +
          '<span class="goal"><em>цель</em>' + esc(m.goal) + "</span></div>" +
        (m.hint ? '<p class="hint">' + esc(m.hint) + "</p>" : "") +
      "</div>";
    }).join("");
  }

  /* ── Демо ── */
  function renderDemos() {
    if (!DATA.demos.length) {
      $("demos").innerHTML = '<div class="empty-state"><b>Пока ни одного демо</b>' +
        "Первая запись появится после первой пятницы. Формат строки: дата · неделя · что показали · реакция директора." +
        "</div>";
      return;
    }
    var rows = DATA.demos.map(function (d) {
      return "<tr><td class=\"d\">" + fmtDate(d.date) + '</td><td class="d">Н' + esc(d.week) + "</td><td>" +
        esc(d.shown) + "</td><td>" + esc(d.reaction || "—") + "</td></tr>";
    }).join("");
    $("demos").innerHTML = '<div class="table-scroll"><table><thead><tr>' +
      "<th>дата</th><th>неделя</th><th>что показали</th><th>реакция директора</th>" +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>";
  }

  /* ── Б-трек ── */
  function renderBtrack() {
    $("btrack").innerHTML = DATA.btrack.map(function (b) {
      var s = normStatus(b.status);
      return '<div class="bt" data-s="' + s + '">' +
        '<span class="box" aria-hidden="true"></span>' +
        '<span class="t">' + esc(b.title) + '<span class="vh"> — ' + LABEL[s] + "</span>" +
          (b.note ? "<em>" + esc(b.note) + "</em>" : "") + "</span>" +
        '<span class="wk">Н' + esc(b.week) + "</span>" +
      "</div>";
    }).join("");
  }

  renderHead();
  renderWeeks();
  renderMetrics();
  renderDemos();
  renderBtrack();
  $("genLine").textContent = "открыто " + new Date().toLocaleDateString("ru-RU") +
    " · Asia/Aqtobe (UTC+5)";
})();
</script>
</body>
</html>
